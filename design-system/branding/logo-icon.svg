<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" role="img" aria-label="DRIPFLOW isotipo">
  <defs>
    <linearGradient id="df-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="df-icon-drop" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#60A5FA" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- App icon rounded square background -->
  <rect width="80" height="80" rx="18" fill="#0B0F1A"/>

  <!-- Outer D shell (inset 5px each side) -->
  <path d="M5 13 C5 8.6 8.6 5 13 5 L35 5 C57 5 75 22 75 43 C75 64 57 81 35 81 L13 81 C8.6 81 5 77.4 5 73 Z"
