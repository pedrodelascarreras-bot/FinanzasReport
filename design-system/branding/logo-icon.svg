<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="DRIPFLOW">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </linearGradient>
    <linearGradient id="d-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="drop-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="112" fill="none"
        stroke="rgba(37,99,235,0.15)" stroke-width="2"/>

  <!-- ── Stylised D — large, centered, bold ── -->
  <!-- Outer D shape -->
  <path d="
    M 120 96
    C 120 96 148 96 188 96
    C 310 96 400 165 400 256
    C 400 347 310 416 188 416
    L 120 416
    C 110 416 102 408 102 398
    L 102 114
    C 102 104 110 96 120 96 Z
  " fill="url(#d-grad)" filter="url(#glow)"/>

  <!-- Inner cutout — creates the D aperture -->
  <path d="
    M 158 160
    L 185 160
    C 268 160 332 202 332 256
    C 332 310 268 352 185 352
    L 158 352 Z
  " fill="#0B0F1A"/>

  <!-- Water drop accent (inside the D aperture) -->
  <ellipse cx="250" cy="210" rx="34" ry="52"
           transform="rotate(-18 250 210)"
           fill="url(#drop-grad)" opacity="0.95"/>

  <!-- Shine highlight on drop -->
  <circle cx="234" cy="192" r="11"
          fill="white" opacity="0.45"/>
  <circle cx="241" cy="197" r="4"
          fill="white" opacity="0.65"/>
</svg>
