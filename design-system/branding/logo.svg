<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none" role="img" aria-label="DRIPFLOW">
  <defs>
    <!-- Official DRIPFLOW gradient — DO NOT MODIFY stop colors -->
    <linearGradient id="df-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Inner drop gradient (lighter highlight) -->
    <linearGradient id="df-drop-grad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#60A5FA" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- ── Isotipo: stylised "D" ── -->
  <g transform="translate(4, 4)">
    <!-- Outer D shell -->
    <path d="M0 8 C0 3.6 3.6 0 8 0 L30 0 C52 0 70 17 70 38 C70 59 52 76 30 76 L8 76 C3.6 76 0 72.4 0 68 Z"
          fill="url(#df-grad)"/>
    <!-- Inner cutout (creates D aperture) -->
    <path d="M16 18 L28 18 C40 18 50 27 50 38 C50 49 40 58 28 58 L16 58 Z"
          fill="#0B0F1A"/>
    <!-- Teardrop / water-drop accent inside -->
    <ellipse cx="36" cy="28" rx="7" ry="10" transform="rotate(-25 36 28)"
             fill="url(#df-drop-grad)" opacity="0.92"/>
    <!-- Shine dot -->
    <circle cx="32" cy="23" r="2.5" fill="white" opacity="0.55"/>
  </g>

  <!-- ── Wordmark: DRIP FLOW ── -->
  <text x="92" y="52"
        font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
        font-weight="700"
        font-size="38"
        letter-spacing="-1"
        fill="#F4F6FB">DRIP</text>

  <text x="200" y="52"
        font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
        font-weight="700"
        font-size="38"
        letter-spacing="-1"
        fill="#2563EB">FLOW</text>

  <!-- ── Tagline ── -->
  <text x="92" y="72"
        font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
        font-weight="500"
        font-size="10"
        letter-spacing="2.5"
        fill="#F4F6FB"
        opacity="0.55">CONTROL TOTAL. FLUJO REAL.</text>
</svg>
