/* ─── SVG donut ─── */
function DonutChart({ data, size=128, sw=18 }) {
  const r = (size - sw) / 2;
  const C = 2 * Math.PI * r;
  const cx = size/2, cy = size/2;
  let off = 0;
  const segs = data.map(d => { const s={...d,off}; off+=d.pct; return s; });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{transform:'rotate(-90deg)'}}>
      {segs.map((s,i) => {
        const da = (s.pct/100)*C;
        return (
          <circle key={i} cx={cx} cy={cy} r={r} fill="none"
            stroke={s.color} strokeWidth={sw}
            strokeDasharray={`${da} ${C-da}`}
            strokeDashoffset={-(s.off/100)*C}
            strokeLinecap="butt" />
        );
      })}
    </svg>
  );
}

/* ─── Sparkline ─── */
function Sparkline({ data, color='#6B4FE8', w=80, h=28 }) {
  if (!data || data.length < 2) return null;
  const mn = Math.min(...data), mx = Math.max(...data), rng = mx-mn||1;
  const pts = data.map((v,i) => `${(i/(data.length-1))*w},${h-((v-mn)/rng)*(h-4)-2}`).join(' ');
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{display:'block'}}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth={1.8}
        strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

        >⋮</button>
        {open && <DropMenu onClose={()=>setOpen(false)}/>}
      </div>
    </div>
  );
}
