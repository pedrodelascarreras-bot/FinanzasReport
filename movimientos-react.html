function DonutChart({ data, size = 128, sw = 18 }) {
  const r = (size - sw) / 2;
  const c = 2 * Math.PI * r;
  const cx = size / 2;
  const cy = size / 2;
  let offset = 0;
  const segs = data.map(segment => {
    const current = { ...segment, offset };
    offset += segment.pct;
    return current;
  });

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ transform: 'rotate(-90deg)' }}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#EEF0F8" strokeWidth={sw} />
      {segs.map((segment, index) => {
        const dash = (segment.pct / 100) * c;
        return (
          <circle
            key={index}
            cx={cx}
            cy={cy}
            r={r}
            fill="none"
            stroke={segment.color}
            strokeWidth={sw}
            strokeDasharray={`${dash} ${c - dash}`}
            strokeDashoffset={-(segment.offset / 100) * c}
          />
        );
      })}
    </svg>
  );
}

function Sparkline({ data, color = P, width = 90, height = 28, strokeWidth = 1.8 }) {
  if (!data || data.length < 2) return null;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const pts = data
    .map((value, index) => `${(index / (data.length - 1)) * width},${height - ((value - min) / range) * (height - 4) - 2}`)
    .join(' ');

  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ display: 'block' }}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function TxnRow({ tx, isLast }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const handler = event => {
      if (ref.current && !ref.current.contains(event.target)) setOpen(false);
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  const amount = tx.cur === 'USD' ? fmtUSD(tx.amt) : `-${fmt(tx.amt)}`;

  return (
    <div
      style={{
        display: 'grid',
        gridTemplateColumns: '40px 45px minmax(0, 1fr) auto 20px',
        alignItems: 'center',
        gap: 10,
        padding: '9px 14px 9px 12px',
        minHeight: 60,
        borderBottom: isLast ? 'none' : '1px solid rgba(83, 74, 119, 0.062)',
      }}
      onMouseEnter={e => { e.currentTarget.style.background = '#FBFBFE'; }}
      onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; }}
    >
      <MerchantLogo
        merchant={tx.merchant}
        fallback={tx.fallback}
        size={34}
        logoUrl={tx.logoUrl}
        customLogoUrl={tx.customLogoUrl}
        category={tx.cat}
        catC={tx.catC}
      />

      <div style={{ fontSize: 10.9, fontWeight: 600, color: '#7E7997', fontVariantNumeric: 'tabular-nums' }}>
        {tx.time}
      </div>

      <div style={{ minWidth: 0 }}>
        <div style={{ fontSize: 12.8, fontWeight: 700, color: TEXT, lineHeight: 1.18, marginBottom: 3, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {tx.name}

        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
          <Chip label={tx.cat} color={tx.catC} />
          {tx.note && (
            <span style={{ fontSize: 10.7, color: SUBTLE, display: 'inline-flex', alignItems: 'center', gap: 4 }}>
              <span style={{ fontSize: 9 }}>↪</span>
              {tx.note}
            </span>
          )}
        </div>
      </div>

      <div style={{ textAlign: 'right', minWidth: 90 }}>
        <div style={{ fontSize: 13, fontWeight: 800, color: tx.cur === 'USD' ? GREEN : ARS_DARK, fontVariantNumeric: 'tabular-nums', letterSpacing: -0.08 }}>
          {amount}
        </div>
        {tx.cur === 'USD' && tx.arsEq && (
          <div style={{ marginTop: 1, fontSize: 10.4, fontWeight: 600, color: '#8C88A2', fontVariantNumeric: 'tabular-nums' }}>
            ({fmt(tx.arsEq)})
          </div>
        )}
      </div>

      <div ref={ref} style={{ position: 'relative', justifySelf: 'end' }}>
        <button
          onClick={event => {
            event.stopPropagation();
            setOpen(!open);
          }}
          style={{
            width: 18,
            height: 18,
            border: 'none',
            borderRadius: 5,
            background: open ? P_LIGHT : 'transparent',
            color: open ? P : '#706B87',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            cursor: 'pointer',
            opacity: open ? 1 : 0.9,
          }}
        >
          <Icons.dots />
        </button>
        {open && <DropMenu onClose={() => setOpen(false)} />}
      </div>
    </div>
  );
}

              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: 10, marginBottom: 15 }}>
                <div style={{ height: 36, borderRadius: 18, background: '#F3F3FA', border: `1px solid rgba(120,114,149,0.10)`, display: 'flex', alignItems: 'center', padding: '0 13px', gap: 10 }}>
                  <span style={{ color: '#7B7694', display: 'flex' }}><Icons.search /></span>
                  <input
                    value={search}
                    onChange={e => setSearch(e.target.value)}
                    placeholder="Buscar movimiento, comercio o categoría..."
                    style={{ border: 'none', outline: 'none', background: 'transparent', flex: 1, fontSize: 12, color: TEXT }}
                  />
                </div>
                <button style={{ height: 36, borderRadius: 18, border: `1px solid rgba(120,114,149,0.10)`, background: '#fff', padding: '0 16px', display: 'inline-flex', alignItems: 'center', gap: 8, cursor: 'pointer', color: '#3E3859', fontSize: 11.8, fontWeight: 800, position: 'relative' }}>
                  <Icons.filter />
                  Filtros
                  <span style={{ width: 6, height: 6, borderRadius: '50%', background: P, marginLeft: 2 }} />
                </button>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 12, marginBottom: 17 }}>
                {SUMMARY.map(card => <SummaryCard key={card.label} card={card} />)}
              </div>

              <div>
                {filteredGroups.map(group => <DayGroup key={group.date} group={group} />)}
              </div>

              <div style={{ display: 'flex', justifyContent: 'center', padding: '4px 0 10px' }}>
                <button style={{ border: 'none', background: 'transparent', color: P, fontSize: 12.8, fontWeight: 800, display: 'inline-flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
                  Ver todos los movimientos del día
                  <Icons.chevron />
                </button>
              </div>
            </main>

            {showPanel && <InsightsPanel onHide={() => setShowPanel(false)} />}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
